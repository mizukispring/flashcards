<html lang="ja">
<head>

<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e2e0d8;
  --accent:#2f6f5e;--accent-ink:#fff;--ok:#2f7d4f;--ng:#b5473a;--chip:#edece6;--focus:#2f6f5e55;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161614;--card:#201f1d;--ink:#ecebe6;--mute:#9a988f;--line:#34332f;
    --accent:#5fb79c;--accent-ink:#0f1a16;--ok:#6cc28c;--ng:#e08a7d;--chip:#2b2a27;--focus:#5fb79c55}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.status{font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;white-space:nowrap;
  font:inherit;font-size:15px;color:var(--mute);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 90px;background:var(--chip);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--mute)}
label.field{display:block;font-size:13px;color:var(--mute)}
label.field>span{display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{appearance:none;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ok{background:var(--ok);color:var(--accent-ink);border-color:var(--ok);font-weight:600}
.btn.ng{background:transparent;color:var(--ng);border-color:var(--ng);font-weight:600}
.btn.danger{color:var(--ng);border-color:var(--ng);background:transparent}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{flex:1 1 140px;padding:14px 16px;font-size:16px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}
.qcard{min-height:170px;display:flex;flex-direction:column;gap:14px}
.qlabel{font-size:12px;color:var(--mute);letter-spacing:.08em}
.qtext{font-size:20px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.atext{font-size:18px;line-height:1.7;white-space:pre-wrap;word-break:break-word;border-top:1px dashed var(--line);padding-top:14px}
.etext{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--mute);margin-top:10px}
.qimgs{display:flex;flex-direction:column;gap:10px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.catbtn{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.catbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.catbtn small{opacity:.75;margin-left:4px}
.tagbtn{font-size:13px;padding:4px 11px}
.chip.tag{background:transparent;border:1px solid var(--line);cursor:pointer}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 7px;
  background:#d9480f;color:#fff;vertical-align:2px}
.badge.upd{background:#1971c2}
.badge.deck{background:#d9480f}
.newbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px}
.item.flag{border-left:4px solid #d9480f}
.item.flag.upd{border-left-color:#1971c2}
.acct{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acct .who{font-size:14px}
.status.cloud{color:var(--accent);font-weight:600}
.chip.tag:hover{border-color:var(--mute)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{appearance:none;font:inherit;font-size:16px;text-align:left;line-height:1.5;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap;word-break:break-word}
.choice:hover:not([disabled]){border-color:var(--mute)}
.choice .no{flex:none;font-size:13px;color:var(--mute);min-width:1.2em;padding-top:2px}
.choice[disabled]{cursor:default}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));font-weight:600}
.choice.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.verdict{font-weight:700;font-size:16px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.grouphead{font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 8px;letter-spacing:.04em}
.imgs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.qimg{display:block;max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.hint{font-size:12px;color:var(--mute)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.item+.item{margin-top:10px}
.item .q{font-weight:600;white-space:pre-wrap;word-break:break-word}
.item .a{color:var(--mute);white-space:pre-wrap;word-break:break-word;margin-top:2px}
.item .e{color:var(--mute);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:6px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{font-size:12px;background:var(--chip);border-radius:999px;padding:1px 10px;color:var(--mute)}
.chip.ok{color:var(--ok)}
.spacer{flex:1}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
h2{font-size:16px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:14px;max-width:90vw;z-index:30}
.result{text-align:center}
.result .n{font-size:40px;font-weight:700;line-height:1.2}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--chip)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.thumb-wrap{position:relative}
.thumb{display:block;width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.thumb-x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ng);
  color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:94vh;border-radius:6px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>一問一答カード</h1>
    <div class="status" id="status" role="status">読み込み中…</div>
  </header>
  <nav role="tablist" aria-label="画面">
    <button role="tab" data-tab="quiz">出題</button>
    <button role="tab" data-tab="cards">カード</button>
    <button role="tab" data-tab="io">まとめて追加・書き出し</button>
  </nav>
  <main id="app"></main>
  <footer class="hint" style="text-align:center;margin-top:28px">版：2026-11-19f（出題中に編集）</footer>
</div>
<div id="toast" class="toast" hidden></div>

<script src="firebase-config.js"></script>
<script>
var cloudReady=new Promise(function(r){window.__cloudResolve=r;});
</script>
<script>
(function(){
"use strict";
var LS_KEY="ichimon-itto-v1";
var savedMode="auto";try{savedMode=localStorage.getItem("ichimon-itto-mode")||"auto";}catch(e){}
var MAX_IMGS=3;
var S={cards:[],tab:"quiz",editing:null,editNode:null,search:"",tagFilter:"",quiz:null,
  opts:{cats:[],tags:[],only:false,onlyNew:false,reverse:false,mode:savedMode},tagFilterT:"",loaded:false,confirmKey:null};

/* ---------- helpers ---------- */
function h(tag,props){
  var e=document.createElement(tag);
  var p=props||{};
  Object.keys(p).forEach(function(k){
    var v=p[k];
    if(k==="class")e.className=v;
    else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var c=kids[j];
      if(c==null||c===false)continue;
      e.append(c);
    }
  }
  return e;
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tags(){var s={};S.cards.forEach(function(c){if(c.tag)s[c.tag]=1;});return Object.keys(s).sort();}
function cardById(id){for(var i=0;i<S.cards.length;i++)if(S.cards[i].id===id)return S.cards[i];return null;}
var toastTimer=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.hidden=true;},2600);
}
function setStatus(){
  var el=document.getElementById("status");
  var cloud=S.mode==="cloud";
  el.className="status"+(cloud?" cloud":"");
  el.textContent=!S.loaded?"読み込み中…":(cloud?"共有モード・":"この端末のみ・")+S.cards.length+"枚";
}
function idList(v){return Array.isArray(v)?v.filter(function(x){return typeof x==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(x);}).slice(0,MAX_IMGS):[];}
function sanitize(c){
  return {id:typeof c.id==="string"&&c.id?c.id:uid(),
    q:String(c.q==null?"":c.q),a:String(c.a==null?"":c.a),e:String(c.e==null?"":c.e),
    tag:String(c.tag==null?"":c.tag).trim(),known:c.known===true,imgs:idList(c.imgs),qimgs:idList(c.qimgs),
    src:typeof c.src==="string"?c.src:"",edited:c.edited===true,catSet:c.catSet===true,
    tags:cleanTags(c.tags),tagSet:c.tagSet===true,choices:cleanChoices(c.choices,c.a),
    badge:c.badge==="new"||c.badge==="upd"?c.badge:"",changed:Array.isArray(c.changed)?c.changed.filter(function(x){return typeof x==="string";}).slice(0,5):[]};
}
function flagged(){return S.cards.filter(function(c){return c.badge;});}
function badgeEl(c){
  if(!c.badge)return null;
  return c.badge==="new"?h("span",{class:"badge"},"NEW"):h("span",{class:"badge upd"},(c.changed.length?c.changed.join("・"):"内容")+"を更新");
}
function clearBadge(c){if(c.badge){if(S.mode==="cloud")CL.seenDirty[c.id]=Date.now();c.badge="";c.changed=[];}}
function cleanChoices(v,a){
  if(typeof v==="string")v=v.split(/\r?\n|[;；／]/);
  if(!Array.isArray(v))return [];
  var out=[],ans=String(a==null?"":a).trim();
  v.forEach(function(t){t=String(t).trim();if(t&&t.length<=300&&t!==ans&&out.indexOf(t)<0)out.push(t);});
  return out.slice(0,5);
}
function cleanTags(v){
  if(typeof v==="string")v=parseTags(v);
  if(!Array.isArray(v))return [];
  var out=[];
  v.forEach(function(t){t=String(t).replace(/^#/,"").trim();if(t&&t.length<=30&&out.indexOf(t)<0)out.push(t);});
  return out.slice(0,12);
}
function parseTags(str){return String(str||"").split(/[,、，\s#＃　]+/).filter(Boolean);}
function tagCounts(){var m={};S.cards.forEach(function(c){c.tags.forEach(function(t){m[t]=(m[t]||0)+1;});});return m;}
function tagList(){var m=tagCounts();return Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b,"ja");});}
function allImgs(c){return (c.qimgs||[]).concat(c.imgs||[]);}
function catOf(c){return c.tag||"未分類";}
function catCounts(){var m={};S.cards.forEach(function(c){var k=catOf(c);m[k]=(m[k]||0)+1;});return m;}
function catList(){return Object.keys(catCounts()).sort(function(a,b){if(a==="未分類")return 1;if(b==="未分類")return -1;return a.localeCompare(b,"ja");});}
function validCard(c){return c&&typeof c.q==="string"&&typeof c.a==="string"&&c.q.trim()&&c.a.trim();}

/* ---------- card storage (localStorage) ---------- */
function readLocal(){
  try{var raw=localStorage.getItem(LS_KEY);if(!raw)return [];
    var d=JSON.parse(raw);return Array.isArray(d)?d.map(sanitize):[];}catch(e){return [];}
}
/* deck cards the user deleted: re-importing a deck must not bring them back */
var DIS_KEY="ichimon-itto-dismissed-v1";
var dismissed={};
function readDismissed(){
  try{var d=JSON.parse(localStorage.getItem(DIS_KEY)||"[]");if(Array.isArray(d))d.forEach(function(k){if(typeof k==="string")dismissed[k]=1;});}catch(e){}
}
function saveDismissed(){
  if(S.mode==="cloud"){cloudWrite(CL.api.setMeta("deck",{dismissed:Object.keys(dismissed)}));return;}
  try{localStorage.setItem(DIS_KEY,JSON.stringify(Object.keys(dismissed)));}catch(e){}
}
var lsWarned=false;
function persist(){
  if(S.mode==="cloud"){persistCloud();return;}
  try{localStorage.setItem(LS_KEY,JSON.stringify(S.cards));}
  catch(e){if(!lsWarned){lsWarned=true;toast("この端末に保存できませんでした（容量不足の可能性）");}}
  setStatus();
}

/* ---------- image storage (IndexedDB, Blob) ---------- */
var idb=null;
function openIDB(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open("ichimon-itto-img",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("images");};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){res(null);};
      r.onblocked=function(){res(null);};
    }catch(e){res(null);}
  });
}
function idbReq(mode,fn){
  return new Promise(function(res,rej){
    if(!idb){rej(new Error("noidb"));return;}
    var tx,out;
    try{tx=idb.transaction("images",mode);out=fn(tx.objectStore("images"));}catch(e){rej(e);return;}
    tx.oncomplete=function(){res(out&&out.result);};
    tx.onerror=tx.onabort=function(){rej(tx.error||new Error("idb"));};
  });
}
function imgPutLocal(id,blob){return idbReq("readwrite",function(s){return s.put(blob,id);});}
function imgPut(id,blob){
  return imgPutLocal(id,blob).then(function(){
    if(S.mode!=="cloud")return;
    return blobToDataURL(blob).then(fitDataURL).then(function(u){return CL.api.putImage(id,u,CL.user.uid);})
      .catch(function(e){toast("画像を共有に保存できませんでした");throw e;});
  });
}
function imgGetLocal(id){return idbReq("readonly",function(s){return s.get(id);});}
function imgGet(id){
  return imgGetLocal(id).catch(function(){return null;}).then(function(b){
    if(b||S.mode!=="cloud")return b;
    return CL.api.getImage(id).then(function(u){
      if(!u)return null;
      return dataURLToBlob(u).then(function(bb){return imgPutLocal(id,bb).catch(function(){}).then(function(){return bb;});});
    }).catch(function(){return null;});
  });
}
/* Firestore documents are limited to 1 MiB: re-encode images that are too large */
function fitDataURL(u){
  if(u.length<900000)return Promise.resolve(u);
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,hh=im.naturalHeight,sc=Math.min(1,900/Math.max(w,hh));
      var cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(hh*sc);
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",0.7));
    };
    im.onerror=function(){res(u);};
    im.src=u;
  });
}
function imgDelRaw(id){return idbReq("readwrite",function(s){return s.delete(id);});}
function imgClear(){return idbReq("readwrite",function(s){return s.clear();});}
function imgKeys(){return idbReq("readonly",function(s){return s.getAllKeys();});}
var urlCache={};
function imgURL(id){
  if(urlCache[id])return Promise.resolve(urlCache[id]);
  return imgGet(id).then(function(b){
    if(!b)return null;
    if(!urlCache[id])urlCache[id]=URL.createObjectURL(b);
    return urlCache[id];
  }).catch(function(){return null;});
}
function imgDelLocal(id){
  if(urlCache[id]){try{URL.revokeObjectURL(urlCache[id]);}catch(e){}delete urlCache[id];}
  return idbReq("readwrite",function(s){return s.delete(id);}).catch(function(){});
}
function imgDel(id){
  if(S.mode==="cloud")CL.api.deleteImage(id).catch(function(){});
  return imgDelLocal(id);
}
/* only this device's cache is cleaned: images of this device's own cards and of shared cards are kept */
function gcImages(){
  if(!idb)return;
  var used={};
  S.cards.concat(readLocal()).forEach(function(c){allImgs(c).forEach(function(id){used[id]=1;});});
  imgKeys().then(function(keys){
    (keys||[]).forEach(function(k){if(!used[k])imgDelLocal(k);});
  }).catch(function(){});
}
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var max=1100,w=im.naturalWidth,hh=im.naturalHeight;
      if(!w||!hh){URL.revokeObjectURL(url);rej(new Error("dec"));return;}
      var sc=Math.min(1,max/Math.max(w,hh)),cw=Math.round(w*sc),ch=Math.round(hh*sc);
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cw,ch);cx.drawImage(im,0,0,cw,ch);
      cv.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error("enc"));},"image/jpeg",0.8);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error("dec"));};
    im.src=url;
  });
}
function blobToDataURL(b){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});
}
function dataURLToBlob(u){return fetch(u).then(function(r){return r.blob();});}

/* image element that fills in its source asynchronously */
function imgEl(id,cls){
  var im=h("img",{class:cls,alt:"解説画像",loading:"lazy"});
  im.addEventListener("click",function(){zoom(id);});
  imgURL(id).then(function(u){if(u)im.src=u;else im.style.display="none";});
  return im;
}
function zoom(id){
  imgURL(id).then(function(u){
    if(!u)return;
    var box=h("div",{class:"lightbox",role:"dialog","aria-label":"画像の拡大"},h("img",{src:u,alt:"拡大した画像"}));
    function close(){box.remove();document.removeEventListener("keydown",onKey,true);}
    function onKey(e){if(e.key==="Escape"){e.preventDefault();close();}}
    box.addEventListener("click",close);
    document.addEventListener("keydown",onKey,true);
    document.body.append(box);
  });
}

/* image picker used by the add form and the edit form */
function imagePicker(existing){
  var items=(existing||[]).map(function(id){return {id:id,fresh:false};});
  var removed=[];
  var strip=h("div",{class:"thumbs"});
  var input=h("input",{type:"file",accept:"image/*",multiple:true,hidden:true});
  var addBtn=h("button",{class:"btn small",type:"button"},"画像を追加");
  var note=h("span",{class:"hint"});
  var el=h("div",null,
    h("div",{class:"row"},addBtn,note),
    strip,input);
  function draw(){
    strip.textContent="";
    items.forEach(function(it){
      var x=h("button",{class:"thumb-x",type:"button","aria-label":"画像を外す"},"×");
      x.addEventListener("click",function(){
        items=items.filter(function(y){return y!==it;});
        if(it.fresh)imgDel(it.id);else removed.push(it.id);
        draw();
      });
      strip.append(h("div",{class:"thumb-wrap"},imgEl(it.id,"thumb"),x));
    });
    if(!idb){addBtn.disabled=true;note.textContent="この環境では画像を保存できません";}
    else{
      addBtn.disabled=items.length>=MAX_IMGS;
      note.textContent=items.length+" / "+MAX_IMGS+"枚（自動で縮小して保存します）";
    }
  }
  addBtn.addEventListener("click",function(){input.click();});
  input.addEventListener("change",async function(){
    var files=[].slice.call(input.files||[]);input.value="";
    var failed=0;
    for(var i=0;i<files.length;i++){
      if(items.length>=MAX_IMGS){toast("画像は1枚のカードにつき"+MAX_IMGS+"枚までです");break;}
      try{
        var blob=await compress(files[i]);
        var id=uid();await imgPut(id,blob);
        items.push({id:id,fresh:true});
      }catch(e){failed++;}
    }
    if(failed)toast(failed+"枚は読み込めませんでした");
    draw();
  });
  draw();
  return {
    el:el,
    ids:function(){return items.map(function(i){return i.id;});},
    /* after saving: really delete the images that were taken off an existing card */
    commit:function(){removed.forEach(function(id){imgDel(id);});removed=[];},
    /* after cancelling: drop the images added in this form */
    discard:function(){items.forEach(function(i){if(i.fresh)imgDel(i.id);});items=items.filter(function(i){return !i.fresh;});removed=[];},
    /* after the card was created from this form */
    reset:function(){items=[];removed=[];draw();}
  };
}

function pool(){
  return S.cards.filter(function(c){
    if(S.opts.cats.length&&S.opts.cats.indexOf(catOf(c))<0)return false;
    if(S.opts.tags.length&&!c.tags.some(function(t){return S.opts.tags.indexOf(t)>=0;}))return false;
    if(S.opts.only&&c.known)return false;
    if(S.opts.onlyNew&&!c.badge)return false;
    return true;
  });
}
function startQuiz(ids){
  var list=ids||shuffle(pool().map(function(c){return c.id;}));
  if(!list.length)return;
  S.quiz={queue:list,i:0,shown:false,ok:0,again:[],done:false,cur:null,opts:null,picked:null};

function answer(known){
  var q=S.quiz;if(!q||!q.shown)return;

/* options for the current question: [{text,right}] or null when not enough material */
/* a one-word answer: short, no list punctuation (parenthesised notes are ignored) */
function isShortAnswer(t){
  t=String(t||"").replace(/（[^）]*）|\([^)]*\)/g,"").trim();
  return t.length<=16&&!/[、，,。\n]/.test(t);
}
function useMC(c){
  var m=S.opts.mode;
  if(m==="mc")return true;
  if(m==="recall")return false;
  return !isShortAnswer(S.opts.reverse?c.q:c.a);
}
function buildChoices(c,rev){
  var right=rev?c.q:c.a,wrong=[];
  if(!rev&&c.choices.length)wrong=c.choices.slice(0,5);
  else{
    /* prefer answers of cards that share tags and category, and that look alike in length */
    var seen={};seen[right]=1;
    var cand=[];
    S.cards.forEach(function(x){
      if(x.id===c.id)return;
      var t=rev?x.q:x.a;
      if(!t||seen[t])return;seen[t]=1;
      var sc=0;
      x.tags.forEach(function(g){if(c.tags.indexOf(g)>=0)sc+=2;});
      if(catOf(x)===catOf(c))sc+=3;
      if(isShortAnswer(t)===isShortAnswer(right))sc+=1;
      cand.push({t:t,sc:sc+Math.random()});
    });
    cand.sort(function(a,b){return b.sc-a.sc;});
    wrong=shuffle(cand.slice(0,6)).slice(0,3).map(function(o){return o.t;});
  }
  if(!wrong.length)return null;
  return shuffle([{text:right,right:true}].concat(wrong.map(function(t){return {text:t,right:false};})));
}
function pickChoice(i){
  var q=S.quiz;if(!q||q.picked!=null||!q.opts)return;

async function deckImages(list){

async function importDeck(d,btn){
  btn.disabled=true;
  try{
    var r=await fetch("decks/"+d.file,{cache:"no-store"});
    if(!r.ok)throw new Error("http");
    var deck=await r.json();
    var src=Array.isArray(deck.cards)?deck.cards:[];
    var bySrc={},byQ={},byKey={};
    S.cards.forEach(function(c){if(c.src)bySrc[c.src]=c;byQ[c.q]=byQ[c.q]||c;byKey[c.q+"\u0000"+c.a]=c;});
    var add=[],upd=0,same=0,del=0,kept=0,skip=0;
    var deckIds={};src.forEach(function(c){if(c&&typeof c.id==="string")deckIds[c.id]=1;});
    var firstTime=!S.cards.some(function(c){return c.src&&deckIds[c.src];});
    for(var i=0;i<src.length;i++){
      var c=src[i];
      if(!validCard(c))continue;
      var sid=typeof c.id==="string"?c.id:"";
      var q=c.q.trim(),a=c.a.trim(),e=String(c.e||"").trim(),cat=String(c.cat||c.tag||deck.cat||deck.tag||"").trim();
      var tg=cleanTags(c.tags),chs=cleanChoices(c.choices,a);
      /* text matches only count for cards that are not already tied to another deck card */
      function free(x){return x&&!(sid&&x.src&&x.src!==sid)?x:null;}
      var hit=(sid&&bySrc[sid])||free(byKey[q+"\u0000"+a])||free(byQ[q])||null;
      if(!hit&&Array.isArray(c.was))for(var j=0;j<c.was.length&&!hit;j++)hit=free(byQ[c.was[j]]);
      if(!hit&&sid&&dismissed[sid]){skip++;continue;}   /* deleted by the user: do not bring back */
      if(hit){
        if(sid)hit.src=sid;
        var tagChanged=!hit.tagSet&&hit.tags.join("\u0000")!==tg.join("\u0000");
        if(!hit.tagSet)hit.tags=tg;
        if(hit.edited){                                  /* edited by the user: keep their version */
          if(!hit.catSet&&hit.tag!==cat){hit.tag=cat;}
          kept++;continue;
        }
        var what=[];
        if(hit.q!==q)what.push("質問");
        if(hit.a!==a)what.push("答え");
        if(hit.e!==e)what.push("解説");
        if(hit.choices.join("\u0000")!==chs.join("\u0000"))what.push("選択肢");
        var changed=tagChanged||what.length>0||(!hit.catSet&&hit.tag!==cat);
        if(what.length&&hit.badge!=="new"){
          hit.badge="upd";
          what.forEach(function(x){if(hit.changed.indexOf(x)<0)hit.changed.push(x);});
        }
        hit.q=q;hit.a=a;hit.e=e;hit.choices=chs;if(!hit.catSet)hit.tag=cat;
        if(!hit.qimgs.length&&Array.isArray(c.qimg)&&c.qimg.length){hit.qimgs=await deckImages(c.qimg);changed=true;}
        if(!hit.imgs.length&&Array.isArray(c.img)&&c.img.length){hit.imgs=await deckImages(c.img);changed=true;}
        if(changed)upd++;else same++;
        continue;
      }
      var nc={id:uid(),q:q,a:a,e:e,choices:chs,tag:cat,known:false,src:sid,tags:tg,tagSet:false,edited:false,catSet:false,
        badge:firstTime?"":"new",changed:[],
        qimgs:await deckImages(c.qimg),imgs:await deckImages(c.img)};
      if(sid)bySrc[sid]=nc;byQ[q]=nc;byKey[q+"\u0000"+a]=nc;
      add.push(nc);
    }
    /* cards the deck has withdrawn (by id or by old question text) */
    var gone=Array.isArray(deck.removed)?deck.removed:[];
    if(gone.length){
      var keep=[];
      S.cards.forEach(function(c){
        if(!c.edited&&((c.src&&gone.indexOf(c.src)>=0)||gone.indexOf(c.q)>=0)){allImgs(c).forEach(function(id){imgDel(id);});del++;}
        else keep.push(c);
      });
      S.cards=keep;
    }
    S.cards=add.concat(S.cards);
    persist();
    deckSeen[d.file]=d.updated||"";saveDeckSeen();
    var parts=[add.length+"枚追加"];
    if(upd)parts.push(upd+"枚を更新");
    if(del)parts.push(del+"枚を削除");
    if(kept)parts.push(kept+"枚は編集済みのため保持");
    if(skip)parts.push(skip+"枚は削除済みのため除外");
    if(same)parts.push(same+"枚は変更なし");
    toast(parts.join("・"));
  }catch(e){toast("デッキを取り込めませんでした");}
  btn.disabled=false;
  if(S.tab==="io")render();
}

var SEPS=["\t","｜","|"];
function parseBulk(text,tag){
  var out=[],skipped=0;
  text.split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    var sep=null;
    for(var i=0;i<SEPS.length;i++){if(line.indexOf(SEPS[i])>=0){sep=SEPS[i];break;}}
    if(!sep){skipped++;return;}
    var parts=line.split(sep);
    var q=parts[0].trim(),a=(parts[1]||"").trim(),e=(parts[2]||"").trim(),chs=cleanChoices(parts.slice(3).join(";"),a);
    if(!q||!a){skipped++;return;}
    out.push({id:uid(),q:q,a:a,e:e,choices:chs,tag:tag,known:false,imgs:[],qimgs:[],src:"",tags:[],tagSet:false,edited:false,catSet:false});
  });
  return {cards:out,skipped:skipped};
}
async function dataImgs(list){

  for(var j=0;j<list.length&&ids.length<MAX_IMGS;j++){

      try{var b=await dataURLToBlob(u);var id=uid();await imgPut(id,b);ids.push(id);}catch(e){}
    }
  }
  return ids;
}

async function importList(list){

    if(!validCard(c))continue;
    added.push({id:uid(),q:c.q.trim(),a:c.a.trim(),e:String(c.e||"").trim(),
      tag:String(c.tag||c.cat||"").trim(),known:c.known===true,src:typeof c.src==="string"?c.src:"",
      edited:c.edited===true,catSet:c.catSet===true,tags:cleanTags(c.tags),tagSet:c.tagSet===true,choices:cleanChoices(c.choices,c.a),
      badge:c.badge==="new"||c.badge==="upd"?c.badge:"",changed:Array.isArray(c.changed)?c.changed:[],
      imgs:await dataImgs(c.imgs),qimgs:await dataImgs(c.qimgs)});

    h("div",{class:"panel stack"},
      h("h2",null,"書き出したデータから追加"),
      jsonIn,
      h("button",{class:"btn",onclick:async function(){
        try{
          var n=await importList(extractList(JSON.parse(jsonIn.value)));
          if(!n)throw new Error("empty");
          jsonIn.value="";setStatus();toast(n+"枚追加しました");
        }catch(e){toast("読み込めませんでした。データを確認してください");}
      }},"追加する")),
    (S.mode!=="cloud"||CL.admin)?h("div",{class:"panel stack"},h("h2",null,"データの削除"),delAll):null);
}

/* ---------- shared mode (Firebase) ---------- */
var CL={api:null,user:null,member:false,admin:false,state:{known:{},seen:{},baseline:0},
  docs:{},synced:{},seenDirty:{},unsub:null,localDismissed:null,pendingRender:false,status:"init"};
var SHARED=["q","a","e","tag","tags","imgs","qimgs","src","edited","catSet","tagSet","choices"];
function sharedKey(c){var o={};SHARED.forEach(function(k){o[k]=c[k];});return JSON.stringify(o);}
var writeWarned=0;
function cloudWrite(p){
  return Promise.resolve(p).catch(function(e){
    if(Date.now()-writeWarned>5000){writeWarned=Date.now();
      toast(e&&e.code==="permission-denied"?"共有データを変更する権限がありません":"共有データへの保存に失敗しました（オフラインなら、つながったときに送られます）");}
  });
}
function cloudBadge(d){
  var none={badge:"",changed:[]};
  if(!CL.user)return none;
  var seen=CL.state.seen[d.id]||0,base=CL.state.baseline||0,me=CL.user.uid;
  if(d.updatedBy===me)return none;
  if((d.createdAt||0)>base&&!seen&&d.createdBy!==me)return {badge:"new",changed:[]};
  if((d.updatedAt||0)>Math.max(base,seen)&&Array.isArray(d.lastChange)&&d.lastChange.length)return {badge:"upd",changed:d.lastChange.slice(0,5)};
  return none;
}
function fromDoc(d){
  var c=sanitize({id:d.id,q:d.q,a:d.a,e:d.e,choices:d.choices,tag:d.cat,tags:d.tags,imgs:d.imgs,qimgs:d.qimgs,src:d.src,
    edited:d.edited,catSet:d.catSet,tagSet:d.tagSet});
  c.known=CL.state.known[d.id]===true;
  var b=cloudBadge(d);c.badge=b.badge;c.changed=b.changed;
  c.by=d.createdByName||"";
  return c;
}
function onCloudCards(list){
  CL.status="ready";
  CL.docs={};CL.synced={};
  list.sort(function(x,y){return (y.createdAt||0)-(x.createdAt||0);});
  var cards=list.map(function(d){CL.docs[d.id]=d;var c=fromDoc(d);CL.synced[d.id]=sharedKey(c);return c;});
  S.cards=cards;S.loaded=true;
  liveRender();
}
function liveRender(){
  var ae=document.activeElement;
  var typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=="checkbox"&&ae.type!=="file";
  if(S.editing||S.quizEdit||typing||document.querySelector(".lightbox")){CL.pendingRender=true;setStatus();return;}
  CL.pendingRender=false;
  if(S.tab==="cards")renderList();
  else if(S.tab==="io")setStatus();
  else render();
  setStatus();
}
document.addEventListener("focusout",function(){if(CL.pendingRender)setTimeout(liveRender,250);});
function persistCloud(){
  setStatus();
  if(!CL.user)return;
  var now=Date.now(),u=CL.user,present={};
  S.cards.forEach(function(c){
    present[c.id]=1;
    var k=sharedKey(c);
    if(CL.synced[c.id]===k)return;
    var prev=CL.docs[c.id],lc=[];
    if(prev){
      if(prev.q!==c.q)lc.push("質問");
      if(prev.a!==c.a)lc.push("答え");
      if((prev.e||"")!==c.e)lc.push("解説");
      if(JSON.stringify(prev.choices||[])!==JSON.stringify(c.choices))lc.push("選択肢");
      if(JSON.stringify(prev.imgs||[])!==JSON.stringify(c.imgs)||JSON.stringify(prev.qimgs||[])!==JSON.stringify(c.qimgs))lc.push("画像");
    }
    var data={q:c.q,a:c.a,e:c.e,choices:c.choices,cat:c.tag,tags:c.tags,imgs:c.imgs,qimgs:c.qimgs,src:c.src,
      edited:c.edited,catSet:c.catSet,tagSet:c.tagSet,
      createdAt:prev&&prev.createdAt||now,createdBy:prev&&prev.createdBy||u.uid,createdByName:prev?(prev.createdByName||""):(u.name||u.email),
      updatedAt:now,updatedBy:u.uid,updatedByName:u.name||u.email,lastChange:lc};
    CL.synced[c.id]=k;CL.docs[c.id]=Object.assign({id:c.id},data);
    if(!prev)c.by=data.createdByName;
    cloudWrite(CL.api.writeCard(c.id,data));
  });
  Object.keys(CL.synced).forEach(function(id){
    if(present[id])return;
    delete CL.synced[id];delete CL.docs[id];
    cloudWrite(CL.api.deleteCard(id));
  });
  var patch=null;
  S.cards.forEach(function(c){
    var kv=c.known===true;
    if((CL.state.known[c.id]===true)!==kv){patch=patch||{};patch.known=patch.known||{};patch.known[c.id]=kv;CL.state.known[c.id]=kv;}
  });
  Object.keys(CL.seenDirty).forEach(function(id){
    patch=patch||{};patch.seen=patch.seen||{};patch.seen[id]=CL.seenDirty[id];CL.state.seen[id]=CL.seenDirty[id];
  });
  CL.seenDirty={};
  if(patch)cloudWrite(CL.api.setUserState(u.uid,patch));
}
async function enterCloud(){
  S.mode="cloud";S.loaded=false;S.quiz=null;S.editing=null;S.editNode=null;CL.status="loading";
  render();
  try{
    var st=await CL.api.getUserState(CL.user.uid)||{};
    var base=st.baseline;
    if(!base){base=Date.now();cloudWrite(CL.api.setUserState(CL.user.uid,{baseline:base}));}
    CL.state={known:st.known||{},seen:st.seen||{},baseline:base};
    var meta=null;try{meta=await CL.api.getMeta("deck");}catch(e){}
    CL.localDismissed=dismissed;dismissed={};
    if(meta&&Array.isArray(meta.dismissed))meta.dismissed.forEach(function(k){dismissed[k]=1;});
  }catch(e){
    S.mode="local";S.cards=readLocal();S.loaded=true;CL.status="error";
    toast("共有データを読み込めませんでした");render();return;
  }
  var timer=setTimeout(function(){if(CL.status==="loading"){toast("共有データの読み込みに時間がかかっています");}},10000);
  CL.unsub=CL.api.subscribeCards(function(list){clearTimeout(timer);if(S.mode==="cloud")onCloudCards(list);},
    function(e){clearTimeout(timer);CL.status="error";toast(e&&e.code==="permission-denied"?"共有カードを見る権限がありません":"共有データとの接続が切れました");});
}
function leaveCloud(){
  if(CL.unsub){try{CL.unsub();}catch(e){}CL.unsub=null;}
  if(S.mode==="cloud"){
    S.mode="local";S.quiz=null;S.editing=null;S.editNode=null;
    if(CL.localDismissed){dismissed=CL.localDismissed;CL.localDismissed=null;}
    S.cards=readLocal();S.loaded=true;
  }
  CL.docs={};CL.synced={};CL.status="init";
}
async function onAuthChange(user){
  CL.user=user;CL.member=false;CL.admin=false;
  if(!user){leaveCloud();render();return;}
  CL.admin=CL.api.isAdmin(user);
  CL.member=await CL.api.checkMember(user);
  if(CL.member&&S.mode!=="cloud")await enterCloud();
  else if(!CL.member){leaveCloud();render();}
}
function accountPanel(){
  var api=CL.api;
  if(!api||!api.configured)return null;
  var box=h("div",{class:"panel stack"},h("h2",null,"共有モード"));
  if(api.failed){box.append(h("p",{class:"hint",style:"margin:0"},"共有サーバーに接続できません。オフラインの可能性があります。いまは、この端末のカードを表示しています。"));return box;}
  if(!CL.user){
    box.append(h("p",{class:"hint",style:"margin:0"},"招待されたメンバーはGoogleアカウントでログインすると、みんなで同じカードを使えます。「覚えた・まだ」は人ごとに分かれ、同じアカウントならスマホとPCで同期されます。"),
      h("button",{class:"btn primary",onclick:function(){
        api.signIn().catch(function(e){toast("ログインできませんでした"+(e&&e.code?"（"+e.code+"）":""));});
      }},"Googleでログイン"));
    return box;
  }
  var who=h("div",{class:"acct"},h("span",{class:"who"},CL.user.email),
    CL.admin?h("span",{class:"chip ok"},"管理者"):null,h("span",{class:"spacer"}),
    h("button",{class:"btn small",onclick:function(){api.signOut();}},"ログアウト"));
  box.append(who);
  if(!CL.member){
    box.append(h("p",{class:"hint",style:"margin:0"},"このアカウントはまだ招待されていません。管理者に、上のメールアドレスを伝えてください。いまは、この端末のカードを表示しています。"));
    return box;
  }
  box.append(h("p",{class:"hint",style:"margin:0"},"共有カードを表示しています。追加・編集・削除はメンバー全員に反映されます。ログアウトすると、この端末だけのカードに戻ります。"));
  var local=readLocal();
  if(local.length){
    var mb=h("button",{class:"btn"},"この端末のカード（"+local.length+"枚）を共有に追加");
    mb.addEventListener("click",function(){migrateLocal(mb);});
    box.append(h("div",null,mb,h("div",{class:"hint",style:"margin-top:4px"},"同じ内容のカードは追加されません。「覚えた」の記録も引き継ぎます。")));
  }
  if(CL.admin)box.append(membersEditor());
  return box;
}
function membersEditor(){
  var ta=h("textarea",{rows:"5",placeholder:"招待する人のGoogleアカウントのメールアドレスを1行に1つ","aria-label":"メンバーのメールアドレス"});
  var note=h("div",{class:"hint"},"読み込み中…");
  CL.api.getMembers().then(function(list){ta.value=list.join("\n");note.textContent="メンバー："+list.length+"人（管理者は自動で含まれます）";})
    .catch(function(){note.textContent="まだメンバーはいません";});
  return h("div",{class:"stack"},h("h2",{style:"margin-top:8px"},"メンバーの招待（管理者のみ）"),ta,note,
    h("button",{class:"btn",onclick:function(){
      var list=ta.value.split(/[\s,、]+/).filter(function(x){return /@/.test(x);});
      CL.api.setMembers(list).then(function(saved){ta.value=saved.join("\n");note.textContent="保存しました。メンバー："+saved.length+"人";})
        .catch(function(){toast("保存できませんでした");});
    }},"保存"));
}
async function migrateLocal(btn){
  btn.disabled=true;
  var local=readLocal(),have={},byKey={},add=[],knownN=0;
  S.cards.forEach(function(c){if(c.src)have["s:"+c.src]=c;byKey[c.q+"\u0000"+c.a]=c;});
  for(var i=0;i<local.length;i++){
    var c=local[i];
    var hit=(c.src&&have["s:"+c.src])||byKey[c.q+"\u0000"+c.a];
    if(hit){if(c.known&&!hit.known){hit.known=true;knownN++;}continue;}
    var ids=allImgs(c);
    for(var j=0;j<ids.length;j++){
      try{var b=await imgGetLocal(ids[j]);if(b)await imgPut(ids[j],b);}catch(e){}
    }
    c.badge="";c.changed=[];
    add.push(c);byKey[c.q+"\u0000"+c.a]=c;
  }
  S.cards=add.concat(S.cards);
  persist();render();
  toast(add.length+"枚を共有に追加しました"+(knownN?"（"+knownN+"枚の「覚えた」を引き継ぎ）":""));
}

/* ---------- events ---------- */
document.querySelectorAll("nav button").forEach(function(b){
  b.addEventListener("click",function(){
    if(S.editNode&&S.editing){/* leaving the tab discards an unsaved edit */S.editing=null;S.editNode=null;}
    S.tab=b.dataset.tab;S.confirmKey=null;S.quizEdit=null;render();
  });
});
document.addEventListener("keydown",function(e){
  if(S.tab!=="quiz"||!S.quiz||S.quiz.done||!S.loaded||S.quizEdit)return;
  if(document.querySelector(".lightbox"))return;
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var q=S.quiz;
  var cc=cardById(q.queue[q.i]);
  if(cc&&useMC(cc)&&q.opts&&q.cur===q.queue[q.i]){
    if(q.picked==null){
      var n=parseInt(e.key,10);
      if(n>=1&&n<=q.opts.length){e.preventDefault();pickChoice(n-1);}
    }else if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){e.preventDefault();answer(q.opts[q.picked].right);}
    return;
  }
  if(e.key===" "||e.key==="Enter"){
    if(!q.shown){e.preventDefault();q.shown=true;render();}
  }else if(e.key==="ArrowRight"){e.preventDefault();answer(true);}
  else if(e.key==="ArrowLeft"){e.preventDefault();answer(false);}
});

/* ---------- start ---------- */
render();
(async function(){
  idb=await openIDB();
  S.cards=readLocal();
  readDismissed();
  S.loaded=true;
  render();
  gcImages();
  var api=await Promise.race([cloudReady,new Promise(function(r){setTimeout(function(){r(null);},12000);})]);
  if(!api||!api.configured)return;
  CL.api=api;
  if(api.failed){if(S.tab==="io")render();return;}
  api.onAuth(function(u){onAuthChange(u).catch(function(){});});
  if(S.tab==="io")render();
})();
})();

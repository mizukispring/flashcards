<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一問一答カード</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e2e0d8;
  --accent:#2f6f5e;--accent-ink:#fff;--ok:#2f7d4f;--ng:#b5473a;--chip:#edece6;--focus:#2f6f5e55;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161614;--card:#201f1d;--ink:#ecebe6;--mute:#9a988f;--line:#34332f;
    --accent:#5fb79c;--accent-ink:#0f1a16;--ok:#6cc28c;--ng:#e08a7d;--chip:#2b2a27;--focus:#5fb79c55}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.status{font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;
  font:inherit;font-size:15px;color:var(--mute);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 90px;background:var(--chip);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--mute)}
label.field{display:block;font-size:13px;color:var(--mute)}
label.field>span{display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{appearance:none;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ok{background:var(--ok);color:var(--accent-ink);border-color:var(--ok);font-weight:600}
.btn.ng{background:transparent;color:var(--ng);border-color:var(--ng);font-weight:600}
.btn.danger{color:var(--ng);border-color:var(--ng);background:transparent}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{flex:1 1 140px;padding:14px 16px;font-size:16px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}
.qcard{min-height:170px;display:flex;flex-direction:column;gap:14px}
.qlabel{font-size:12px;color:var(--mute);letter-spacing:.08em}
.qtext{font-size:20px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.atext{font-size:18px;line-height:1.7;white-space:pre-wrap;word-break:break-word;border-top:1px dashed var(--line);padding-top:14px}
.hint{font-size:12px;color:var(--mute)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.item+.item{margin-top:10px}
.item .q{font-weight:600;white-space:pre-wrap;word-break:break-word}
.item .a{color:var(--mute);white-space:pre-wrap;word-break:break-word;margin-top:2px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{font-size:12px;background:var(--chip);border-radius:999px;padding:1px 10px;color:var(--mute)}
.chip.ok{color:var(--ok)}
.spacer{flex:1}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
h2{font-size:16px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:14px;max-width:90vw;z-index:10}
.result{text-align:center}
.result .n{font-size:40px;font-weight:700;line-height:1.2}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--chip)}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一問一答">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<div class="wrap">
  <header>
    <h1>一問一答カード</h1>
    <div class="status" id="status" role="status">読み込み中…</div>
  </header>
  <nav role="tablist" aria-label="画面">
    <button role="tab" data-tab="quiz">出題</button>
    <button role="tab" data-tab="cards">カード</button>
    <button role="tab" data-tab="io">まとめて追加・書き出し</button>
  </nav>
  <main id="app"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
var LS_KEY="ichimon-itto-v1";
var S={cards:[],tab:"quiz",mode:"local",ref:null,editing:null,search:"",tagFilter:"",quiz:null,
  opts:{tag:"",only:false,reverse:false},loaded:false,confirmKey:null};

/* ---------- helpers ---------- */
function h(tag,props){
  var e=document.createElement(tag);
  var p=props||{};
  Object.keys(p).forEach(function(k){
    var v=p[k];
    if(k==="class")e.className=v;
    else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var c=kids[j];
      if(c==null||c===false)continue;
      e.append(c);
    }
  }
  return e;
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tags(){var s={};S.cards.forEach(function(c){if(c.tag)s[c.tag]=1;});return Object.keys(s).sort();}
function cardById(id){for(var i=0;i<S.cards.length;i++)if(S.cards[i].id===id)return S.cards[i];return null;}
var toastTimer=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.hidden=true;},2400);
}
function setStatus(){
  var el=document.getElementById("status");
  el.textContent=!S.loaded?"読み込み中…":
    (S.mode==="db"?"アカウントに自動保存":"この端末のブラウザにのみ保存")+"・"+S.cards.length+"枚";
}
function sanitize(c){
  return {id:typeof c.id==="string"&&c.id?c.id:uid(),
    q:String(c.q==null?"":c.q),a:String(c.a==null?"":c.a),
    tag:String(c.tag==null?"":c.tag).trim(),known:c.known===true};
}

/* ---------- storage ---------- */
function readLocal(){
  try{var raw=localStorage.getItem(LS_KEY);if(!raw)return null;
    var d=JSON.parse(raw);return Array.isArray(d)?d.map(sanitize):null;}catch(e){return null;}
}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.cards));}catch(e){}}
function withTimeout(p,ms){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error("timeout"));},ms);
    p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});
  });
}
async function initStorage(){
  var local=readLocal()||[];
  S.cards=local;
  try{
    if(!window.claude||typeof window.claude.use!=="function")throw new Error("no runtime");
    var db=await withTimeout(window.claude.use("db"),10000);
    var user=await withTimeout(window.claude.use("user"),10000);
    var id=user?await user.id():null;
    if(!db||!id)throw new Error("no db");
    var ref=db.collection("data/users/"+id).doc("flashcards");
    var snap=await withTimeout(ref.get(),10000);
    if(snap.exists){
      var d=snap.data()||{};
      if(Array.isArray(d.cards))S.cards=d.cards.map(sanitize);
    }
    S.ref=ref;S.mode="db";
    if(!snap.exists&&local.length){await ref.set({cards:S.cards});}
  }catch(e){S.mode="local";S.ref=null;}
  S.loaded=true;
}
var saving=false,dirty=false;
async function persist(){
  writeLocal();
  setStatus();
  if(S.mode!=="db"||!S.ref)return;
  dirty=true;
  if(saving)return;
  saving=true;
  while(dirty){
    dirty=false;
    try{await S.ref.set({cards:S.cards});}
    catch(e){
      toast(e&&e.code==="quota_exceeded"?"保存容量がいっぱいです。不要なカードを削除してください":"アカウントへの保存に失敗しました（この端末には保存済み）");
    }
  }
  saving=false;
}

/* ---------- views ---------- */
var app=document.getElementById("app");

function render(){
  setStatus();
  document.querySelectorAll("nav button").forEach(function(b){
    b.setAttribute("aria-selected",b.dataset.tab===S.tab?"true":"false");
  });
  app.textContent="";
  if(!S.loaded){app.append(h("div",{class:"empty"},"読み込み中…"));return;}
  if(S.tab==="quiz")app.append(viewQuiz());
  else if(S.tab==="cards")app.append(viewCards());
  else app.append(viewIO());
}

/* --- quiz --- */
function pool(){
  return S.cards.filter(function(c){
    if(S.opts.tag&&c.tag!==S.opts.tag)return false;
    if(S.opts.only&&c.known)return false;
    return true;
  });
}
function startQuiz(ids){
  var list=ids||shuffle(pool().map(function(c){return c.id;}));
  if(!list.length)return;
  S.quiz={queue:list,i:0,shown:false,ok:0,again:[],done:false};
  render();
}
function answer(known){
  var q=S.quiz;if(!q||!q.shown)return;
  var id=q.queue[q.i],c=cardById(id);
  if(c){c.known=known;persist();}
  if(known)q.ok++;else q.again.push(id);
  q.i++;q.shown=false;
  if(q.i>=q.queue.length)q.done=true;
  render();
}
function viewQuiz(){
  var q=S.quiz;
  if(!S.cards.length){
    return h("div",{class:"panel empty"},
      h("p",null,"まだカードがありません。"),
      h("div",{class:"row",style:"justify-content:center"},
        h("button",{class:"btn primary",onclick:function(){S.tab="cards";render();}},"カードを作る"),
        h("button",{class:"btn",onclick:addSamples},"サンプルを入れてみる")));
  }
  if(!q)return quizSetup();
  if(q.done)return quizResult();
  var id=q.queue[q.i],c=cardById(id);
  if(!c){q.i++;if(q.i>=q.queue.length)q.done=true;return viewQuiz();}
  var front=S.opts.reverse?c.a:c.q,back=S.opts.reverse?c.q:c.a;
  var pct=Math.round(q.i/q.queue.length*100);
  var box=h("div",{class:"panel stack"},
    h("div",null,
      h("div",{class:"prog"},h("span",null,(q.i+1)+" / "+q.queue.length),h("span",null,c.tag||"")),
      h("div",{class:"bar"},h("i",{style:"width:"+pct+"%"}))),
    h("div",{class:"qcard"},
      h("div",{class:"qlabel"},S.opts.reverse?"答え":"質問"),
      h("div",{class:"qtext"},front),
      q.shown?h("div",null,h("div",{class:"qlabel"},S.opts.reverse?"質問":"答え"),h("div",{class:"atext"},back)):null),
    q.shown?
      h("div",{class:"row"},
        h("button",{class:"btn ng big",onclick:function(){answer(false);}},"まだ ←"),
        h("button",{class:"btn ok big",onclick:function(){answer(true);}},"覚えた →")):
      h("div",{class:"row"},
        h("button",{class:"btn primary big",id:"reveal",onclick:function(){q.shown=true;render();}},"答えを見る")),
    h("div",{class:"row"},
      h("span",{class:"hint"},h("kbd",null,"Space"),"で答え　",h("kbd",null,"←"),"まだ　",h("kbd",null,"→"),"覚えた"),
      h("span",{class:"spacer"}),
      h("button",{class:"btn small",onclick:function(){S.quiz=null;render();}},"やめる")));
  return box;
}
function quizSetup(){
  var known=S.cards.filter(function(c){return c.known;}).length;
  var n=pool().length;
  var tagSel=h("select",{id:"qtag",onchange:function(e){S.opts.tag=e.target.value;render();}},
    h("option",{value:""},"すべてのタグ"),
    tags().map(function(t){var o=h("option",{value:t},t);if(t===S.opts.tag)o.selected=true;return o;}));
  return h("div",{class:"panel stack"},
    h("div",{class:"stats"},
      h("div",{class:"stat"},h("b",null,S.cards.length),h("span",null,"カード総数")),
      h("div",{class:"stat"},h("b",null,known),h("span",null,"覚えた")),
      h("div",{class:"stat"},h("b",null,S.cards.length-known),h("span",null,"まだ"))),
    h("label",{class:"field"},h("span",null,"出題するタグ"),tagSel),
    h("label",{class:"check"},
      h("input",{type:"checkbox",checked:S.opts.only,onchange:function(e){S.opts.only=e.target.checked;render();}}),
      "「まだ」のカードだけ出す"),
    h("label",{class:"check"},
      h("input",{type:"checkbox",checked:S.opts.reverse,onchange:function(e){S.opts.reverse=e.target.checked;render();}}),
      "答えから質問を当てる（逆出題）"),
    h("button",{class:"btn primary",disabled:n===0,onclick:function(){startQuiz();}},
      n===0?"出題できるカードがありません":"スタート（"+n+"問）"));
}
function quizResult(){
  var q=S.quiz,total=q.queue.length;
  return h("div",{class:"panel stack result"},
    h("div",{class:"qlabel"},"結果"),
    h("div",{class:"n"},q.ok+" / "+total),
    h("div",{class:"hint"},"覚えた "+q.ok+"　まだ "+q.again.length),
    h("div",{class:"row",style:"justify-content:center"},
      q.again.length?h("button",{class:"btn primary",onclick:function(){startQuiz(shuffle(q.again));}},"「まだ」の"+q.again.length+"問をもう一度"):null,
      h("button",{class:"btn",onclick:function(){S.quiz=null;render();}},"最初に戻る")));
}

/* --- cards --- */
function viewCards(){
  var qIn=h("textarea",{id:"nq",placeholder:"例：尿素回路でフマル酸が出てくる意味は？",rows:"2"});
  var aIn=h("textarea",{id:"na",placeholder:"答え",rows:"3"});
  var tIn=h("input",{type:"text",id:"nt",placeholder:"タグ（任意） 例：生化学",list:"taglist"});
  var dl=h("datalist",{id:"taglist"},tags().map(function(t){return h("option",{value:t});}));
  function add(){
    var q=qIn.value.trim(),a=aIn.value.trim();
    if(!q||!a){toast("質問と答えの両方を入力してください");return;}
    S.cards.unshift({id:uid(),q:q,a:a,tag:tIn.value.trim(),known:false});
    persist();
    qIn.value="";aIn.value="";
    renderList();setStatus();
    dl.textContent="";tags().forEach(function(t){dl.append(h("option",{value:t}));});
    qIn.focus();
    toast("追加しました");
  }
  aIn.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();add();}});
  var listBox=h("div",{id:"list"});
  var search=h("input",{type:"text",placeholder:"検索",value:S.search,"aria-label":"カードを検索",
    oninput:function(e){S.search=e.target.value;renderList();}});
  var tagSel=h("select",{"aria-label":"タグで絞り込み",onchange:function(e){S.tagFilter=e.target.value;renderList();}},
    h("option",{value:""},"すべて"),
    tags().map(function(t){var o=h("option",{value:t},t);if(t===S.tagFilter)o.selected=true;return o;}));
  var wrap=h("div",{class:"stack"},
    h("div",{class:"panel stack"},
      h("h2",null,"カードを追加"),
      h("label",{class:"field"},h("span",null,"質問"),qIn),
      h("label",{class:"field"},h("span",null,"答え"),aIn),
      h("label",{class:"field"},h("span",null,"タグ"),tIn),dl,
      h("div",{class:"row"},
        h("button",{class:"btn primary",onclick:add},"追加"),
        h("span",{class:"hint"},"答え欄で ",h("kbd",null,"Ctrl/⌘"),"+",h("kbd",null,"Enter"),"でも追加"))),
    h("div",{class:"row"},h("div",{style:"flex:2 1 160px"},search),h("div",{style:"flex:1 1 120px"},tagSel)),
    listBox);
  setTimeout(renderList,0);
  return wrap;
}
function renderList(){
  var box=document.getElementById("list");if(!box)return;
  box.textContent="";
  var s=S.search.trim().toLowerCase();
  var items=S.cards.filter(function(c){
    if(S.tagFilter&&c.tag!==S.tagFilter)return false;
    if(!s)return true;
    return (c.q+" "+c.a+" "+c.tag).toLowerCase().indexOf(s)>=0;
  });
  if(!items.length){
    box.append(h("div",{class:"empty"},S.cards.length?"該当するカードがありません":"まだカードがありません"));
    if(!S.cards.length)box.append(h("div",{class:"row",style:"justify-content:center"},h("button",{class:"btn",onclick:addSamples},"サンプルを入れてみる")));
    return;
  }
  box.append(h("div",{class:"hint",style:"margin-bottom:8px"},items.length+"枚"));
  items.forEach(function(c){box.append(S.editing===c.id?editItem(c):viewItem(c));});
}
function viewItem(c){
  var delKey="del:"+c.id;
  var delBtn=h("button",{class:"btn small danger"},S.confirmKey===delKey?"本当に削除":"削除");
  delBtn.addEventListener("click",function(){
    if(S.confirmKey===delKey){
      S.cards=S.cards.filter(function(x){return x.id!==c.id;});
      S.confirmKey=null;persist();renderList();setStatus();toast("削除しました");
    }else{
      S.confirmKey=delKey;delBtn.textContent="本当に削除";
      setTimeout(function(){if(S.confirmKey===delKey){S.confirmKey=null;delBtn.textContent="削除";}},3000);
    }
  });
  return h("div",{class:"item"},
    h("div",{class:"q"},c.q),
    h("div",{class:"a"},c.a),
    h("div",{class:"meta"},
      c.tag?h("span",{class:"chip"},c.tag):null,
      h("span",{class:"chip"+(c.known?" ok":"")},c.known?"覚えた":"まだ"),
      h("span",{class:"spacer"}),
      h("button",{class:"btn small",onclick:function(){S.editing=c.id;S.confirmKey=null;renderList();}},"編集"),
      delBtn));
}
function editItem(c){
  var q=h("textarea",{rows:"2","aria-label":"質問"},c.q);
  var a=h("textarea",{rows:"3","aria-label":"答え"},c.a);
  var t=h("input",{type:"text",value:c.tag,placeholder:"タグ","aria-label":"タグ",list:"taglist"});
  return h("div",{class:"item stack"},q,a,t,
    h("div",{class:"row"},
      h("button",{class:"btn small primary",onclick:function(){
        var nq=q.value.trim(),na=a.value.trim();
        if(!nq||!na){toast("質問と答えの両方を入力してください");return;}
        c.q=nq;c.a=na;c.tag=t.value.trim();
        S.editing=null;persist();renderList();
      }},"保存"),
      h("button",{class:"btn small",onclick:function(){S.editing=null;renderList();}},"キャンセル")));
}
function addSamples(){
  var samples=[
    ["ネコがアルギニン欠乏で高アンモニア血症になるのはなぜ？","尿素回路のオルニチンが枯渇し、CPS1の活性化因子NAGも減る。ネコは内因性合成が弱く、尿素回路の活性も下げられないため。","生化学"],
    ["DNAポリメラーゼが合成できる向きは？","5'→3'のみ。新規合成はできず、3'-OHを持つプライマーが必要。","分子生物"],
    ["「20 nt」の nt とは？","nucleotide（ヌクレオチド）。一本鎖の長さの単位。二本鎖には bp を使う。","分子生物"]
  ];
  samples.forEach(function(s){S.cards.push({id:uid(),q:s[0],a:s[1],tag:s[2],known:false});});
  persist();render();toast("サンプルを3枚追加しました");
}

/* --- import / export --- */
function parseBulk(text,tag){
  var out=[],skipped=0;
  text.split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    var i=line.indexOf("\t"),w=1;
    if(i<0){i=line.indexOf("｜");}
    if(i<0){i=line.indexOf("|");}
    if(i<0){skipped++;return;}
    var q=line.slice(0,i).trim(),a=line.slice(i+w).trim();
    if(!q||!a){skipped++;return;}
    out.push({id:uid(),q:q,a:a,tag:tag,known:false});
  });
  return {cards:out,skipped:skipped};
}
function viewIO(){
  var bulk=h("textarea",{rows:"7",placeholder:"質問 | 答え\n質問 | 答え\n（タブ区切り、全角｜区切りも可。Excelやスプレッドシートからの貼り付けもOK）"});
  var bulkTag=h("input",{type:"text",placeholder:"まとめて付けるタグ（任意）"});
  var jsonOut=h("textarea",{rows:"6",readonly:true,"aria-label":"書き出しデータ"});
  jsonOut.value=JSON.stringify(S.cards.map(function(c){return {q:c.q,a:c.a,tag:c.tag,known:c.known};}),null,1);
  var jsonIn=h("textarea",{rows:"5",placeholder:"書き出したデータをここに貼り付けて、追加できます"});
  var delKey="all";
  var delAll=h("button",{class:"btn danger"},"すべてのカードを削除");
  delAll.addEventListener("click",function(){
    if(S.confirmKey===delKey){
      S.cards=[];S.quiz=null;S.confirmKey=null;persist();render();toast("すべて削除しました");
    }else{
      S.confirmKey=delKey;delAll.textContent="本当に削除（元に戻せません）";
      setTimeout(function(){if(S.confirmKey===delKey){S.confirmKey=null;delAll.textContent="すべてのカードを削除";}},3500);
    }
  });
  return h("div",{class:"stack"},
    h("div",{class:"panel stack"},
      h("h2",null,"まとめて追加"),
      h("p",{class:"hint",style:"margin:0"},"1行に1枚。質問と答えを「|」またはタブで区切ります。"),
      bulk,bulkTag,
      h("button",{class:"btn primary",onclick:function(){
        var r=parseBulk(bulk.value,bulkTag.value.trim());
        if(!r.cards.length){toast("取り込める行がありません（区切り文字を確認してください）");return;}
        S.cards=r.cards.reverse().concat(S.cards);
        persist();bulk.value="";setStatus();
        toast(r.cards.length+"枚追加"+(r.skipped?"（"+r.skipped+"行は区切りがなく除外）":""));
      }},"取り込む")),
    h("div",{class:"panel stack"},
      h("h2",null,"書き出し（バックアップ）"),
      jsonOut,
      h("button",{class:"btn",onclick:async function(){
        try{await navigator.clipboard.writeText(jsonOut.value);toast("コピーしました");}
        catch(e){jsonOut.focus();jsonOut.select();toast("選択しました。コピーしてください");}
      }},"コピー")),
    h("div",{class:"panel stack"},
      h("h2",null,"書き出したデータから追加"),
      jsonIn,
      h("button",{class:"btn",onclick:function(){
        try{
          var d=JSON.parse(jsonIn.value);
          if(d&&!Array.isArray(d)&&Array.isArray(d.cards))d=d.cards;
          if(!Array.isArray(d))throw new Error("形式");
          var add=d.filter(function(c){return c&&typeof c.q==="string"&&typeof c.a==="string"&&c.q.trim()&&c.a.trim();})
            .map(function(c){return sanitize({q:c.q.trim(),a:c.a.trim(),tag:c.tag,known:c.known});});
          if(!add.length)throw new Error("空");
          S.cards=S.cards.concat(add);persist();jsonIn.value="";setStatus();
          toast(add.length+"枚追加しました");
        }catch(e){toast("読み込めませんでした。データを確認してください");}
      }},"追加する")),
    h("div",{class:"panel stack"},h("h2",null,"データの削除"),delAll));
}

/* ---------- events ---------- */
document.querySelectorAll("nav button").forEach(function(b){
  b.addEventListener("click",function(){S.tab=b.dataset.tab;S.editing=null;S.confirmKey=null;render();});
});
document.addEventListener("keydown",function(e){
  if(S.tab!=="quiz"||!S.quiz||S.quiz.done||!S.loaded)return;
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===" "||e.key==="Enter"){
    if(!S.quiz.shown){e.preventDefault();S.quiz.shown=true;render();}
  }else if(e.key==="ArrowRight"){e.preventDefault();answer(true);}
  else if(e.key==="ArrowLeft"){e.preventDefault();answer(false);}
});

/* ---------- start ---------- */
render();
initStorage().then(function(){render();});
})();
</script>

  });

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一問一答">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e2e0d8;
  --accent:#2f6f5e;--accent-ink:#fff;--ok:#2f7d4f;--ng:#b5473a;--chip:#edece6;--focus:#2f6f5e55;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161614;--card:#201f1d;--ink:#ecebe6;--mute:#9a988f;--line:#34332f;
    --accent:#5fb79c;--accent-ink:#0f1a16;--ok:#6cc28c;--ng:#e08a7d;--chip:#2b2a27;--focus:#5fb79c55}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.status{font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;white-space:nowrap;
  font:inherit;font-size:15px;color:var(--mute);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 90px;background:var(--chip);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--mute)}
label.field{display:block;font-size:13px;color:var(--mute)}
label.field>span{display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{appearance:none;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ok{background:var(--ok);color:var(--accent-ink);border-color:var(--ok);font-weight:600}
.btn.ng{background:transparent;color:var(--ng);border-color:var(--ng);font-weight:600}
.btn.danger{color:var(--ng);border-color:var(--ng);background:transparent}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{flex:1 1 140px;padding:14px 16px;font-size:16px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}
.qcard{min-height:170px;display:flex;flex-direction:column;gap:14px}
.qlabel{font-size:12px;color:var(--mute);letter-spacing:.08em}
.qtext{font-size:20px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.atext{font-size:18px;line-height:1.7;white-space:pre-wrap;word-break:break-word;border-top:1px dashed var(--line);padding-top:14px}
.etext{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--mute);margin-top:10px}
.qimgs{display:flex;flex-direction:column;gap:10px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.catbtn{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.catbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.catbtn small{opacity:.75;margin-left:4px}
.grouphead{font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 8px;letter-spacing:.04em}
.imgs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.qimg{display:block;max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.hint{font-size:12px;color:var(--mute)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.item+.item{margin-top:10px}
.item .q{font-weight:600;white-space:pre-wrap;word-break:break-word}
.item .a{color:var(--mute);white-space:pre-wrap;word-break:break-word;margin-top:2px}
.item .e{color:var(--mute);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:6px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{font-size:12px;background:var(--chip);border-radius:999px;padding:1px 10px;color:var(--mute)}
.chip.ok{color:var(--ok)}
.spacer{flex:1}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
h2{font-size:16px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:14px;max-width:90vw;z-index:30}
.result{text-align:center}
.result .n{font-size:40px;font-weight:700;line-height:1.2}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--chip)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.thumb-wrap{position:relative}
.thumb{display:block;width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.thumb-x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ng);
  color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:94vh;border-radius:6px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>一問一答カード</h1>
    <div class="status" id="status" role="status">読み込み中…</div>
  </header>
  <nav role="tablist" aria-label="画面">
    <button role="tab" data-tab="quiz">出題</button>
    <button role="tab" data-tab="cards">カード</button>
    <button role="tab" data-tab="io">まとめて追加・書き出し</button>
  </nav>
  <main id="app"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
var LS_KEY="ichimon-itto-v1";
var MAX_IMGS=3;
var S={cards:[],tab:"quiz",editing:null,editNode:null,search:"",tagFilter:"",quiz:null,
  opts:{cats:[],only:false,reverse:false},loaded:false,confirmKey:null};

/* ---------- helpers ---------- */
function h(tag,props){
  var e=document.createElement(tag);
  var p=props||{};
  Object.keys(p).forEach(function(k){
    var v=p[k];
    if(k==="class")e.className=v;
    else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var c=kids[j];
      if(c==null||c===false)continue;
      e.append(c);
    }
  }
  return e;
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tags(){var s={};S.cards.forEach(function(c){if(c.tag)s[c.tag]=1;});return Object.keys(s).sort();}
function cardById(id){for(var i=0;i<S.cards.length;i++)if(S.cards[i].id===id)return S.cards[i];return null;}
var toastTimer=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.hidden=true;},2600);
}
function setStatus(){
  var el=document.getElementById("status");
  el.textContent=!S.loaded?"読み込み中…":"この端末のブラウザに保存・"+S.cards.length+"枚";
}
function idList(v){return Array.isArray(v)?v.filter(function(x){return typeof x==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(x);}).slice(0,MAX_IMGS):[];}
function sanitize(c){
  return {id:typeof c.id==="string"&&c.id?c.id:uid(),
    q:String(c.q==null?"":c.q),a:String(c.a==null?"":c.a),e:String(c.e==null?"":c.e),
    tag:String(c.tag==null?"":c.tag).trim(),known:c.known===true,imgs:idList(c.imgs),qimgs:idList(c.qimgs),
    src:typeof c.src==="string"?c.src:"",edited:c.edited===true,catSet:c.catSet===true};
}
function allImgs(c){return (c.qimgs||[]).concat(c.imgs||[]);}
function catOf(c){return c.tag||"未分類";}
function catCounts(){var m={};S.cards.forEach(function(c){var k=catOf(c);m[k]=(m[k]||0)+1;});return m;}
function catList(){return Object.keys(catCounts()).sort(function(a,b){if(a==="未分類")return 1;if(b==="未分類")return -1;return a.localeCompare(b,"ja");});}
function validCard(c){return c&&typeof c.q==="string"&&typeof c.a==="string"&&c.q.trim()&&c.a.trim();}

/* ---------- card storage (localStorage) ---------- */
function readLocal(){
  try{var raw=localStorage.getItem(LS_KEY);if(!raw)return [];
    var d=JSON.parse(raw);return Array.isArray(d)?d.map(sanitize):[];}catch(e){return [];}
}
/* deck cards the user deleted: re-importing a deck must not bring them back */
var DIS_KEY="ichimon-itto-dismissed-v1";
var dismissed={};
function readDismissed(){
  try{var d=JSON.parse(localStorage.getItem(DIS_KEY)||"[]");if(Array.isArray(d))d.forEach(function(k){if(typeof k==="string")dismissed[k]=1;});}catch(e){}
}
function saveDismissed(){try{localStorage.setItem(DIS_KEY,JSON.stringify(Object.keys(dismissed)));}catch(e){}}
var lsWarned=false;
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S.cards));}
  catch(e){if(!lsWarned){lsWarned=true;toast("この端末に保存できませんでした（容量不足の可能性）");}}
  setStatus();
}

/* ---------- image storage (IndexedDB, Blob) ---------- */
var idb=null;
function openIDB(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open("ichimon-itto-img",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("images");};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){res(null);};
      r.onblocked=function(){res(null);};
    }catch(e){res(null);}
  });
}
function idbReq(mode,fn){
  return new Promise(function(res,rej){
    if(!idb){rej(new Error("noidb"));return;}
    var tx,out;
    try{tx=idb.transaction("images",mode);out=fn(tx.objectStore("images"));}catch(e){rej(e);return;}
    tx.oncomplete=function(){res(out&&out.result);};
    tx.onerror=tx.onabort=function(){rej(tx.error||new Error("idb"));};
  });
}
function imgPut(id,blob){return idbReq("readwrite",function(s){return s.put(blob,id);});}
function imgGet(id){return idbReq("readonly",function(s){return s.get(id);});}
function imgDelRaw(id){return idbReq("readwrite",function(s){return s.delete(id);});}
function imgClear(){return idbReq("readwrite",function(s){return s.clear();});}
function imgKeys(){return idbReq("readonly",function(s){return s.getAllKeys();});}
var urlCache={};
function imgURL(id){
  if(urlCache[id])return Promise.resolve(urlCache[id]);
  return imgGet(id).then(function(b){
    if(!b)return null;
    if(!urlCache[id])urlCache[id]=URL.createObjectURL(b);
    return urlCache[id];
  }).catch(function(){return null;});
}
function imgDel(id){
  if(urlCache[id]){try{URL.revokeObjectURL(urlCache[id]);}catch(e){}delete urlCache[id];}
  return idbReq("readwrite",function(s){return s.delete(id);}).catch(function(){});
}
function gcImages(){
  if(!idb)return;
  var used={};
  S.cards.forEach(function(c){allImgs(c).forEach(function(id){used[id]=1;});});
  imgKeys().then(function(keys){
    (keys||[]).forEach(function(k){if(!used[k])imgDel(k);});
  }).catch(function(){});
}
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var max=1280,w=im.naturalWidth,hh=im.naturalHeight;
      if(!w||!hh){URL.revokeObjectURL(url);rej(new Error("dec"));return;}
      var sc=Math.min(1,max/Math.max(w,hh)),cw=Math.round(w*sc),ch=Math.round(hh*sc);
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
      var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cw,ch);cx.drawImage(im,0,0,cw,ch);
      cv.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error("enc"));},"image/jpeg",0.82);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error("dec"));};
    im.src=url;
  });
}
function blobToDataURL(b){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});
}
function dataURLToBlob(u){return fetch(u).then(function(r){return r.blob();});}

/* image element that fills in its source asynchronously */
function imgEl(id,cls){
  var im=h("img",{class:cls,alt:"解説画像",loading:"lazy"});
  im.addEventListener("click",function(){zoom(id);});
  imgURL(id).then(function(u){if(u)im.src=u;else im.style.display="none";});
  return im;
}
function zoom(id){
  imgURL(id).then(function(u){
    if(!u)return;
    var box=h("div",{class:"lightbox",role:"dialog","aria-label":"画像の拡大"},h("img",{src:u,alt:"拡大した画像"}));
    function close(){box.remove();document.removeEventListener("keydown",onKey,true);}
    function onKey(e){if(e.key==="Escape"){e.preventDefault();close();}}
    box.addEventListener("click",close);
    document.addEventListener("keydown",onKey,true);
    document.body.append(box);
  });
}

/* image picker used by the add form and the edit form */
function imagePicker(existing){
  var items=(existing||[]).map(function(id){return {id:id,fresh:false};});
  var removed=[];
  var strip=h("div",{class:"thumbs"});
  var input=h("input",{type:"file",accept:"image/*",multiple:true,hidden:true});
  var addBtn=h("button",{class:"btn small",type:"button"},"画像を追加");
  var note=h("span",{class:"hint"});
  var el=h("div",null,
    h("div",{class:"row"},addBtn,note),
    strip,input);
  function draw(){
    strip.textContent="";
    items.forEach(function(it){
      var x=h("button",{class:"thumb-x",type:"button","aria-label":"画像を外す"},"×");
      x.addEventListener("click",function(){
        items=items.filter(function(y){return y!==it;});
        if(it.fresh)imgDel(it.id);else removed.push(it.id);
        draw();
      });
      strip.append(h("div",{class:"thumb-wrap"},imgEl(it.id,"thumb"),x));
    });
    if(!idb){addBtn.disabled=true;note.textContent="この環境では画像を保存できません";}
    else{
      addBtn.disabled=items.length>=MAX_IMGS;
      note.textContent=items.length+" / "+MAX_IMGS+"枚（自動で縮小して保存します）";
    }
  }
  addBtn.addEventListener("click",function(){input.click();});
  input.addEventListener("change",async function(){
    var files=[].slice.call(input.files||[]);input.value="";
    var failed=0;
    for(var i=0;i<files.length;i++){
      if(items.length>=MAX_IMGS){toast("画像は1枚のカードにつき"+MAX_IMGS+"枚までです");break;}
      try{
        var blob=await compress(files[i]);
        var id=uid();await imgPut(id,blob);
        items.push({id:id,fresh:true});
      }catch(e){failed++;}
    }
    if(failed)toast(failed+"枚は読み込めませんでした");
    draw();
  });
  draw();
  return {
    el:el,
    ids:function(){return items.map(function(i){return i.id;});},
    /* after saving: really delete the images that were taken off an existing card */
    commit:function(){removed.forEach(function(id){imgDel(id);});removed=[];},
    /* after cancelling: drop the images added in this form */
    discard:function(){items.forEach(function(i){if(i.fresh)imgDel(i.id);});items=items.filter(function(i){return !i.fresh;});removed=[];},
    /* after the card was created from this form */
    reset:function(){items=[];removed=[];draw();}
  };
}

/* ---------- views ---------- */
var app=document.getElementById("app");

function render(){
  setStatus();
  document.querySelectorAll("nav button").forEach(function(b){
    b.setAttribute("aria-selected",b.dataset.tab===S.tab?"true":"false");
  });
  app.textContent="";
  if(!S.loaded){app.append(h("div",{class:"empty"},"読み込み中…"));return;}
  if(S.tab==="quiz")app.append(viewQuiz());
  else if(S.tab==="cards")app.append(viewCards());
  else app.append(viewIO());
}

/* --- quiz --- */
function pool(){
  return S.cards.filter(function(c){
    if(S.opts.cats.length&&S.opts.cats.indexOf(catOf(c))<0)return false;
    if(S.opts.only&&c.known)return false;
    return true;
  });
}
function startQuiz(ids){
  var list=ids||shuffle(pool().map(function(c){return c.id;}));
  if(!list.length)return;
  S.quiz={queue:list,i:0,shown:false,ok:0,again:[],done:false};
  render();
}
function answer(known){
  var q=S.quiz;if(!q||!q.shown)return;
  var id=q.queue[q.i],c=cardById(id);
  if(c){c.known=known;persist();}
  if(known)q.ok++;else q.again.push(id);
  q.i++;q.shown=false;
  if(q.i>=q.queue.length)q.done=true;
  render();
}
function explanation(c){
  return [
    c.e?h("div",{class:"etext"},c.e):null,
    c.imgs.length?h("div",{class:"imgs"},c.imgs.map(function(id){return imgEl(id,"qimg");})):null
  ];
}
function qImages(c){
  return c.qimgs.length?h("div",{class:"qimgs"},c.qimgs.map(function(id){return imgEl(id,"qimg");})):null;
}
function viewQuiz(){
  var q=S.quiz;
  if(!S.cards.length){
    return h("div",{class:"panel empty"},
      h("p",null,"まだカードがありません。"),
      h("div",{class:"row",style:"justify-content:center"},
        h("button",{class:"btn primary",onclick:function(){S.tab="cards";render();}},"カードを作る"),
        h("button",{class:"btn",onclick:function(){S.tab="io";render();}},"デッキを取り込む")));
  }
  if(!q)return quizSetup();
  if(q.done)return quizResult();
  var id=q.queue[q.i],c=cardById(id);
  if(!c){q.i++;if(q.i>=q.queue.length)q.done=true;return viewQuiz();}
  var rev=S.opts.reverse,front=rev?c.a:c.q,back=rev?c.q:c.a;
  var pct=Math.round(q.i/q.queue.length*100);
  return h("div",{class:"panel stack"},
    h("div",null,
      h("div",{class:"prog"},h("span",null,(q.i+1)+" / "+q.queue.length),h("span",null,catOf(c))),
      h("div",{class:"bar"},h("i",{style:"width:"+pct+"%"}))),
    h("div",{class:"qcard"},
      h("div",{class:"qlabel"},S.opts.reverse?"答え":"質問"),
      h("div",{class:"qtext"},front),
      rev?null:qImages(c),
      q.shown?h("div",null,
        h("div",{class:"qlabel"},rev?"質問":"答え"),
        h("div",{class:"atext"},back),
        rev?qImages(c):null,
        explanation(c)):null),
    q.shown?
      h("div",{class:"row"},
        h("button",{class:"btn ng big",onclick:function(){answer(false);}},"まだ ←"),
        h("button",{class:"btn ok big",onclick:function(){answer(true);}},"覚えた →")):
      h("div",{class:"row"},
        h("button",{class:"btn primary big",onclick:function(){q.shown=true;render();}},"答えを見る")),
    h("div",{class:"row"},

function safeDeckPath(p){return typeof p==="string"&&/^[A-Za-z0-9._\/-]+\.(jpe?g|png|webp|gif)$/i.test(p)&&p.indexOf("..")<0;}
async function deckImages(list){
  var ids=[];
  if(!idb||!Array.isArray(list))return ids;
  for(var i=0;i<list.length&&ids.length<MAX_IMGS;i++){
    if(!safeDeckPath(list[i]))continue;
    try{
      var r=await fetch("decks/"+list[i]);if(!r.ok)continue;
      var b=await r.blob();var id=uid();await imgPut(id,b);ids.push(id);
    }catch(e){}
  }
  return ids;
}
async function importDeck(d,btn){
  btn.disabled=true;
  try{
    var r=await fetch("decks/"+d.file,{cache:"no-store"});
    if(!r.ok)throw new Error("http");
    var deck=await r.json();
    var src=Array.isArray(deck.cards)?deck.cards:[];
    var bySrc={},byQ={},byKey={};
    S.cards.forEach(function(c){if(c.src)bySrc[c.src]=c;byQ[c.q]=byQ[c.q]||c;byKey[c.q+"\u0000"+c.a]=c;});
    var add=[],upd=0,same=0,del=0,kept=0,skip=0;
    for(var i=0;i<src.length;i++){
      var c=src[i];
      if(!validCard(c))continue;
      var sid=typeof c.id==="string"?c.id:"";
      var q=c.q.trim(),a=c.a.trim(),e=String(c.e||"").trim(),cat=String(c.cat||c.tag||deck.cat||deck.tag||"").trim();
      var hit=(sid&&bySrc[sid])||byKey[q+"\u0000"+a]||byQ[q]||null;
      if(!hit&&Array.isArray(c.was))for(var j=0;j<c.was.length&&!hit;j++)hit=byQ[c.was[j]]||null;
      if(!hit&&sid&&dismissed[sid]){skip++;continue;}   /* deleted by the user: do not bring back */
      if(hit){
        if(sid)hit.src=sid;
        if(hit.edited){                                  /* edited by the user: keep their version */
          if(!hit.catSet&&hit.tag!==cat){hit.tag=cat;}
          kept++;continue;
        }
        var changed=hit.q!==q||hit.a!==a||hit.e!==e||(!hit.catSet&&hit.tag!==cat);
        hit.q=q;hit.a=a;hit.e=e;if(!hit.catSet)hit.tag=cat;
        if(!hit.qimgs.length&&Array.isArray(c.qimg)&&c.qimg.length){hit.qimgs=await deckImages(c.qimg);changed=true;}
        if(!hit.imgs.length&&Array.isArray(c.img)&&c.img.length){hit.imgs=await deckImages(c.img);changed=true;}
        if(changed)upd++;else same++;
        continue;
      }
      var nc={id:uid(),q:q,a:a,e:e,tag:cat,known:false,src:sid,
        qimgs:await deckImages(c.qimg),imgs:await deckImages(c.img)};
      if(sid)bySrc[sid]=nc;byQ[q]=nc;byKey[q+"\u0000"+a]=nc;
      add.push(nc);
    }
    /* cards the deck has withdrawn (by id or by old question text) */
    var gone=Array.isArray(deck.removed)?deck.removed:[];
    if(gone.length){
      var keep=[];
      S.cards.forEach(function(c){
        if(!c.edited&&((c.src&&gone.indexOf(c.src)>=0)||gone.indexOf(c.q)>=0)){allImgs(c).forEach(function(id){imgDel(id);});del++;}
        else keep.push(c);
      });
      S.cards=keep;
    }
    S.cards=add.concat(S.cards);
    persist();
    var parts=[add.length+"枚追加"];
    if(upd)parts.push(upd+"枚を更新");
    if(del)parts.push(del+"枚を削除");
    if(kept)parts.push(kept+"枚は編集済みのため保持");
    if(skip)parts.push(skip+"枚は削除済みのため除外");
    if(same)parts.push(same+"枚は変更なし");
    toast(parts.join("・"));
  }catch(e){toast("デッキを取り込めませんでした");}
  btn.disabled=false;
}

/* --- import / export --- */
var SEPS=["\t","｜","|"];
function parseBulk(text,tag){
  var out=[],skipped=0;
  text.split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    var sep=null;
    for(var i=0;i<SEPS.length;i++){if(line.indexOf(SEPS[i])>=0){sep=SEPS[i];break;}}
    if(!sep){skipped++;return;}
    var parts=line.split(sep);
    var q=parts[0].trim(),a=(parts[1]||"").trim(),e=parts.slice(2).join(sep).trim();
    if(!q||!a){skipped++;return;}
    out.push({id:uid(),q:q,a:a,e:e,tag:tag,known:false,imgs:[],qimgs:[],src:""});
  });
  return {cards:out,skipped:skipped};
}
async function dataImgs(list){
  var ids=[];
  if(!Array.isArray(list)||!idb)return ids;
  for(var j=0;j<list.length&&ids.length<MAX_IMGS;j++){
    var u=list[j];
    if(typeof u==="string"&&u.indexOf("data:image/")===0){
      try{var b=await dataURLToBlob(u);var id=uid();await imgPut(id,b);ids.push(id);}catch(e){}
    }
  }
  return ids;
}
/* Import cards from parsed JSON. Images arrive as data: URLs and go into IndexedDB. */
async function importList(list){
  var added=[];
  for(var i=0;i<list.length;i++){
    var c=list[i];
    if(!validCard(c))continue;
    added.push({id:uid(),q:c.q.trim(),a:c.a.trim(),e:String(c.e||"").trim(),
      tag:String(c.tag||c.cat||"").trim(),known:c.known===true,src:typeof c.src==="string"?c.src:"",
      edited:c.edited===true,catSet:c.catSet===true,
      imgs:await dataImgs(c.imgs),qimgs:await dataImgs(c.qimgs)});
  }
  S.cards=S.cards.concat(added);
  persist();
  return added.length;
}
function extractList(d){
  if(d&&!Array.isArray(d)&&Array.isArray(d.cards))d=d.cards;
  if(!Array.isArray(d))throw new Error("format");
  return d;
}
async function exportFile(btn){
  btn.disabled=true;
  try{
    var out=[];
    for(var i=0;i<S.cards.length;i++){
      var c=S.cards[i],imgs=[],qimgs=[];
      for(var j=0;j<c.imgs.length;j++){
        var b=await imgGet(c.imgs[j]).catch(function(){return null;});
        if(b)imgs.push(await blobToDataURL(b));
      }
      for(var k=0;k<c.qimgs.length;k++){
        var b2=await imgGet(c.qimgs[k]).catch(function(){return null;});
        if(b2)qimgs.push(await blobToDataURL(b2));
      }
      out.push({q:c.q,a:c.a,e:c.e,tag:c.tag,known:c.known,src:c.src,edited:c.edited,catSet:c.catSet,imgs:imgs,qimgs:qimgs});
    }
    var blob=new Blob([JSON.stringify({app:"ichimon-itto",version:3,cards:out,dismissed:Object.keys(dismissed)})],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=h("a",{href:url,download:"ichimon-itto-backup.json"});
    document.body.append(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);

  }catch(e){toast("書き出せませんでした");}
  btn.disabled=false;
}

    try{
      var parsed=JSON.parse(await f.text());
      if(parsed&&Array.isArray(parsed.dismissed)){parsed.dismissed.forEach(function(k){if(typeof k==="string")dismissed[k]=1;});saveDismissed();}
      var n=await importList(extractList(parsed));
      if(!n)throw new Error("empty");
      setStatus();toast(n+"枚を読み込みました");
    }catch(e){toast("読み込めませんでした。バックアップのファイルを確認してください");}
  });
  var expBtn=h("button",{class:"btn",onclick:function(){exportFile(expBtn);}},"画像つきでファイルに書き出す");
  var delKey="all";
  var delAll=h("button",{class:"btn danger"},"すべてのカードを削除");
  delAll.addEventListener("click",function(){
    if(S.confirmKey===delKey){
      S.cards=[];S.quiz=null;S.confirmKey=null;dismissed={};saveDismissed();
      Object.keys(urlCache).forEach(function(k){try{URL.revokeObjectURL(urlCache[k]);}catch(e){}delete urlCache[k];});
      if(idb)imgClear().catch(function(){});
      persist();render();toast("すべて削除しました");
    }else{
      S.confirmKey=delKey;delAll.textContent="本当に削除（元に戻せません）";
      setTimeout(function(){if(S.confirmKey===delKey){S.confirmKey=null;delAll.textContent="すべてのカードを削除";}},3500);
    }
  });
  return h("div",{class:"stack"},
    deckPanel(),
    h("div",{class:"panel stack"},
      h("h2",null,"まとめて追加"),
      h("p",{class:"hint",style:"margin:0"},"1行に1枚。質問・答え（・解説）を「|」またはタブで区切ります。"),
      bulk,bulkTag,h("datalist",{id:"taglist2"},tags().map(function(t){return h("option",{value:t});})),
      h("button",{class:"btn primary",onclick:function(){
        var r=parseBulk(bulk.value,bulkTag.value.trim());
        if(!r.cards.length){toast("取り込める行がありません（区切り文字を確認してください）");return;}
        S.cards=r.cards.reverse().concat(S.cards);
        persist();bulk.value="";
        toast(r.cards.length+"枚追加"+(r.skipped?"（"+r.skipped+"行は区切りがなく除外）":""));
      }},"取り込む")),
    h("div",{class:"panel stack"},
      h("h2",null,"バックアップ（画像つき）"),
      h("p",{class:"hint",style:"margin:0"},"カードと画像を1つのファイルに書き出します。機種変更や、ブラウザのデータを消す前に使ってください。"),
      h("div",{class:"row"},expBtn,
        h("button",{class:"btn",onclick:function(){fileIn.click();}},"ファイルから読み込む")),
      fileIn),
    h("div",{class:"panel stack"},
      h("h2",null,"書き出し（文字のみ）"),
      h("p",{class:"hint",style:"margin:0"},"画像は含まれません。"),
      jsonOut,
      h("button",{class:"btn",onclick:async function(){
        try{await navigator.clipboard.writeText(jsonOut.value);toast("コピーしました");}
        catch(e){jsonOut.focus();jsonOut.select();toast("選択しました。コピーしてください");}
      }},"コピー")),
    h("div",{class:"panel stack"},
      h("h2",null,"書き出したデータから追加"),
      jsonIn,
      h("button",{class:"btn",onclick:async function(){
        try{
          var n=await importList(extractList(JSON.parse(jsonIn.value)));
          if(!n)throw new Error("empty");
          jsonIn.value="";setStatus();toast(n+"枚追加しました");
        }catch(e){toast("読み込めませんでした。データを確認してください");}
      }},"追加する")),
    h("div",{class:"panel stack"},h("h2",null,"データの削除"),delAll));
}

/* ---------- events ---------- */
document.querySelectorAll("nav button").forEach(function(b){
  b.addEventListener("click",function(){
    if(S.editNode&&S.editing){/* leaving the tab discards an unsaved edit */S.editing=null;S.editNode=null;}
    S.tab=b.dataset.tab;S.confirmKey=null;render();
  });
});
document.addEventListener("keydown",function(e){
  if(S.tab!=="quiz"||!S.quiz||S.quiz.done||!S.loaded)return;
  if(document.querySelector(".lightbox"))return;
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===" "||e.key==="Enter"){
    if(!S.quiz.shown){e.preventDefault();S.quiz.shown=true;render();}
  }else if(e.key==="ArrowRight"){e.preventDefault();answer(true);}
  else if(e.key==="ArrowLeft"){e.preventDefault();answer(false);}
});

/* ---------- start ---------- */
render();
(async function(){
  idb=await openIDB();
  S.cards=readLocal();
  readDismissed();
  S.loaded=true;
  render();
  gcImages();
})();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
